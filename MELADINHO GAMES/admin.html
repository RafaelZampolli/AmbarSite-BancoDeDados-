<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Admin — Meladinhos Games</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { padding: 40px 20px; }
    .admin-box { max-width: 800px; margin: 0 auto; background: #12122a; padding: 30px; border-radius: 12px; border: 2px solid #0ff; }
    .admin-box h1 { color: #0ff; font-family: 'Press Start 2P'; font-size: 16px; margin-bottom: 20px; }
    .form-linha { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .admin-box input, .admin-box textarea { width: 100%; padding: 10px; background: #0a0a1a; border: 1px solid #2a2a5a; border-radius: 6px; color: #fff; }
    .admin-box label { font-size: 12px; opacity: 0.7; display: block; margin-bottom: 4px; }
    .lista-produtos { margin-top: 30px; }
    .lista-produtos table { width: 100%; border-collapse: collapse; }
    .lista-produtos th, .lista-produtos td { padding: 10px; text-align: left; border-bottom: 1px solid #2a2a5a; font-size: 13px; }
    .lista-produtos button { background: #f00; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  </style>
</head>
<body>
  <div class="admin-box">
    <h1>⚙️ ADMIN — MELADINHOS GAMES</h1>
    <p style="opacity:.7; margin-bottom: 20px;">Adicione novos itens ao cardápio. Não precisa programar.</p>

    <div class="form-linha">
      <div><label>Nome do Produto</label><input id="f-nome" placeholder="Ex: Combo Boss" /></div>
      <div><label>Preço (R$)</label><input id="f-preco" type="number" step="0.01" placeholder="29.90" /></div>
    </div>
    <div style="margin-bottom:12px"><label>Descrição</label><input id="f-desc" placeholder="Ingredientes ou detalhes" /></div>
    <div style="margin-bottom:12px"><label>URL da Imagem</label><input id="f-img" placeholder="https://..." /></div>
    <button class="btn-primary" onclick="adicionarProduto()">➕ Adicionar Produto</button>
    <button class="btn-secondary" onclick="salvarJSON()">💾 Salvar Cardápio (download)</button>

    <div class="lista-produtos">
      <h3 style="color:#0ff; margin-bottom:12px;">Produtos Atuais</h3>
      <table>
        <thead><tr><th>Nome</th><th>Preço</th><th>Descrição</th><th></th></tr></thead>
        <tbody id="tabela-produtos"></tbody>
      </table>
    </div>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
