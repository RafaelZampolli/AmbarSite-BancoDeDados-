<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Interno — Ambar Web</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="dash-layout">
    <!-- MENU LATERAL -->
    <aside class="sidebar">
      <h2>Ambar Interno</h2>
      <nav>
        <button class="active" onclick="mudarAba('dashboard', this)">📊 Visão Geral</button>
        <button onclick="mudarAba('pedidos', this)">📥 Central de Pedidos</button>
        <button onclick="mudarAba('projetos', this)">🚀 Projetos e Tarefas</button>
      </nav>
      <div class="user-info">
        <p id="userEmail">Carregando...</p>
        <button onclick="logout()">Sair do Sistema</button>
      </div>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="main-content">
      
      <!-- ABA 1: VISÃO GERAL -->
      <div id="aba-dashboard" class="tab-pane active">
        <h2 style="margin-bottom: 20px;">Bem-vindo de volta!</h2>
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon amber">📥</div>
            <div><h3 id="statPendentes">0</h3><p>Pedidos Pendentes</p></div>
          </div>
          <div class="stat-card">
            <div class="stat-icon green">✅</div>
            <div><h3 id="statRespondidos">0</h3><p>Pedidos Respondidos</p></div>
          </div>
          <div class="stat-card">
            <div class="stat-icon blue">🚀</div>
            <div><h3 id="statProjetos">0</h3><p>Projetos Ativos</p></div>
          </div>
        </div>
      </div>

      <!-- ABA 2: PEDIDOS -->
      <div id="aba-pedidos" class="tab-pane">
        <h2 style="margin-bottom: 20px;">Central de Pedidos</h2>
        <div id="listaPedidos" class="grid-cards"></div>
      </div>

      <!-- ABA 3: PROJETOS E TAREFAS -->
      <div id="aba-projetos" class="tab-pane">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <h2>Gestão de Projetos</h2>
          <!-- Botão que só aparece para ADMIN -->
          <button id="btnNovoProjeto" onclick="abrirModalProjeto()" class="btn btn--primary btn--sm" style="display: none;">+ Novo Projeto</button>
        </div>
        <div id="listaProjetos" class="grid-cards"></div>
      </div>

    </main>
  </div>

  <!-- MODAL: CRIAR/EDITAR PROJETO -->
  <div id="modalProjeto" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000;">
    <div class="modal-box" style="background: #fff; padding: 30px; border-radius: 14px; max-width: 500px; width: 100%;">
      <h3 id="tituloModalProjeto" style="margin-bottom: 15px;">Novo Projeto</h3>
      <input type="hidden" id="projetoId">
      
      <label style="display: block; margin-bottom: 10px; font-size: 0.9rem;">Nome do Projeto
        <input type="text" id="projetoNome" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; margin-top: 5px;">
      </label>
      <label style="display: block; margin-bottom: 10px; font-size: 0.9rem;">Status
        <select id="projetoStatus" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; margin-top: 5px;">
          <option value="Em andamento">Em andamento</option>
          <option value="Concluído">Concluído</option>
          <option value="Pausado">Pausado</option>
        </select>
      </label>
      <label style="display: block; margin-bottom: 10px; font-size: 0.9rem;">E-mail do Responsável
        <input type="email" id="projetoResp" placeholder="funcionario@ambarweb.com" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; margin-top: 5px;">
      </label>
      <label style="display: block; margin-bottom: 20px; font-size: 0.9rem;">Link do Repositório (Git)
        <input type="url" id="projetoRepo" placeholder="https://github.com/..." style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; margin-top: 5px;">
      </label>
      
      <div style="display: flex; gap: 10px; justify-content: flex-end;">
        <button onclick="fecharModalProjeto()" class="btn btn--ghost btn--sm">Cancelar</button>
        <button onclick="salvarProjeto()" class="btn btn--primary btn--sm">Salvar Projeto</button>
      </div>
    </div>
  </div>

  <!-- MODAL: ADICIONAR TAREFA -->
  <div id="modalTarefa" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000;">
    <div class="modal-box" style="background: #fff; padding: 30px; border-radius: 14px; max-width: 500px; width: 100%;">
      <h3 style="margin-bottom: 15px;">Adicionar Tarefa</h3>
      <input type="hidden" id="tarefaProjetoId">
      
      <label style="display: block; margin-bottom: 20px; font-size: 0.9rem;">Descrição da Tarefa
        <input type="text" id="tarefaTexto" placeholder="Ex: Criar tela de login" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; margin-top: 5px;">
      </label>
      
      <div style="display: flex; gap: 10px; justify-content: flex-end;">
        <button onclick="fecharModalTarefa()" class="btn btn--ghost btn--sm">Cancelar</button>
        <button onclick="salvarTarefa()" class="btn btn--primary btn--sm">Adicionar</button>
      </div>
    </div>
  </div>

  <script src="js/dashboard.js"></script>
</body>
</html>
